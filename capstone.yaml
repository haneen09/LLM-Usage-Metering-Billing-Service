run: cd billing-engine && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
base_url: http://127.0.0.1:8000
seed: cd billing-engine && python -m alembic upgrade head && python seed.py

endpoints:
  - POST /generate
  - GET /usage
  - POST /checkout
  - POST /webhooks/stripe
  - GET /checkout-success
  - GET /checkout-cancelled
